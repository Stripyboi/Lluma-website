<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LUMA – Design portfolio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#F7F4EE;--ink:#15140F;--panel:#ECE7DA;--card:#F7F4EE;--line:#15140F;--accent:#2B44E0;--accent-text:#2B44E0;--logo-filter:none;--logo-blend:multiply;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121110;--ink:#F2EFE8;--panel:#1B1A17;--card:#232220;--line:#F2EFE8;--accent-text:#9AA8FF;--logo-filter:invert(1);--logo-blend:screen;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121110;--ink:#F2EFE8;--panel:#1B1A17;--card:#232220;--line:#F2EFE8;--accent-text:#9AA8FF;--logo-filter:invert(1);--logo-blend:screen;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Heebo',Arial,sans-serif;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto}
.pad{padding:72px clamp(20px,4.4vw,56px)}
a{color:inherit}
h1,h2,h3{margin:0;font-weight:800}
h2{font-size:clamp(30px,4vw,40px)}
.nav{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;padding:24px clamp(20px,4.4vw,56px)}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:26px;letter-spacing:2px}
.brand img{width:52px;height:52px;mix-blend-mode:var(--logo-blend);filter:var(--logo-filter)}
.links{display:flex;gap:28px;flex-wrap:wrap;align-items:center;font-size:16px}
.links a{text-decoration:none}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:14px 32px;border-radius:8px;font:700 18px 'Heebo',Arial,sans-serif;text-decoration:none;cursor:pointer}
.btn-p{background:var(--accent);color:#fff;border:2px solid var(--accent)}
.btn-o{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn-s{padding:8px 16px;font-size:16px}
.hero{display:flex;flex-direction:column;gap:28px;max-width:880px;padding-bottom:80px}
.role{font-weight:700;color:var(--accent-text)}
.hero h1{font-size:clamp(36px,6vw,64px);line-height:1.1}
.hero p{margin:0;font-size:clamp(18px,2vw,21px);max-width:640px}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.panel{background:var(--panel)}
.work{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;margin-top:32px}
.cat{font:inherit;text-align:start;cursor:pointer;border:2px solid var(--line);border-radius:12px;padding:28px;min-height:160px;background:var(--card);color:var(--ink)}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.cat b{display:block;font-size:28px;font-weight:800;margin-bottom:8px}
.cat span{font-size:17px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.tile{aspect-ratio:4/5;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.tile img,.tile video{width:100%;height:100%;object-fit:contain;-webkit-user-drag:none}
.tile img{pointer-events:none}
.about{max-width:880px;display:flex;flex-direction:column;gap:20px}
.about p{margin:0;font-size:20px}
.pk{background:#15140F;color:#F7F4EE}
.pks{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:24px;margin-top:40px}
.pcard{border-radius:12px;padding:32px;background:var(--card);color:var(--ink)}
.pcard.hi{background:#2B44E0;color:#fff}
.pcard h3{font-size:24px}
.price{font-size:36px;font-weight:800;margin:8px 0 16px;color:var(--accent-text)}
.hi .price{color:#fff}
.pcard ul{margin:0;padding-inline-start:22px;font-size:17px;display:flex;flex-direction:column;gap:8px}
.fine{margin:32px 0 0;font-size:16px;color:#D8D4C8;max-width:800px}
.contact{display:flex;flex-direction:column;gap:20px;align-items:flex-start;padding-top:80px;padding-bottom:80px}
.contact h2{font-size:clamp(32px,4.4vw,44px)}
.contact p{margin:0;font-size:20px;max-width:560px}
.soc{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:17px}
.soc b{font-weight:700}
.soc a{border:2px solid var(--line);border-radius:8px;padding:10px 24px;min-height:44px;display:inline-flex;align-items:center;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
<div class="nav" data-protect>
<div class="brand"><img src="assets/luma-logo.png" alt="" draggable="false"><span>LUMA</span></div>
<div class="links"><a href="#work" data-t="navWork"></a><a href="#about" data-t="navAbout"></a><a href="#packages" data-t="navPackages"></a><a href="#contact" data-t="navContact"></a><button class="btn btn-o btn-s" id="lang" type="button"></button></div>
</div>
<section class="pad hero">
<div class="role" data-t="role"></div>
<h1 data-t="h1"></h1>
<p data-t="sub"></p>
<div class="row"><a class="btn btn-p" href="https://www.fiverr.com/s/EmrXez8" data-t="cta1"></a><a class="btn btn-o" href="#work" data-t="cta2"></a></div>
</section>
<section id="work" class="pad panel work" data-protect>
<h2 data-t="workTitle"></h2>
<p style="margin:12px 0 0;font-size:18px" data-t="workSub"></p>
<div class="cats" id="cats"></div>
<h3 id="galTitle" style="margin:48px 0 20px;font-size:28px"></h3>
<div class="gal" id="gal"></div>
</section>
<section id="about" class="pad about"><h2 data-t="aboutTitle"></h2><p data-t="about"></p></section>
<section id="packages" class="pad pk">
<h2 data-t="packagesTitle"></h2>
<div class="pks" id="pks"></div>
<p class="fine" data-t="fine"></p>
</section>
<section id="contact" class="pad contact">
<h2 data-t="contactTitle"></h2>
<p data-t="contactSub"></p>
<a class="btn btn-p" href="https://www.fiverr.com/s/EmrXez8" data-t="contactCta"></a>
<div data-t="contactLine" style="font-size:17px"></div>
<div class="soc"><b data-t="followLabel"></b><a href="#" id="ig"></a><a href="#" id="tt"></a></div>
</section>
</div>
